[project]
authors = [{name = "Charles Shan", email = "charles.shht@gmail.com"}]
dependencies = ["dmpython>=2.5.38,<3"]
name = "swa2"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
swa2 = { path = ".", editable = true }
swa = { path = "../swa", editable = true }

[tool.pixi.tasks]
gui = "python -m swa2.app"

[tool.pixi.dependencies]
pyside6 = ">=6.11.1,<7"
numpy = ">=2.5.1,<3"
pandas = ">=3.0.3,<4"
scikit-learn = ">=1.9.0,<2"
